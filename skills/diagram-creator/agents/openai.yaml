interface:
  display_name: "Diagram Creator"
  short_description: "Create maintainable text-based diagrams"
  default_prompt: "Use $diagram-creator to create or revise maintainable Mermaid, PlantUML, D2, or ASCII diagram source for docs, architecture notes, workflows, data flows, sequences, models, or lightweight timelines. Extract source-grounded facts first, avoid blindly preserving flawed old diagrams, and do not use this skill for polished figure assets or visual-reference image work."
